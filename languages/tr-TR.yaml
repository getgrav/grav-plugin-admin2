    HTTP_X_FORWARDED_IP_HELP: 'İstemci IP''sini çözümlerken <code>X-Forwarded-For</code> / <code>X-Forwarded</code> / <code>Forwarded</code> üst bilgilerine güvenin. Yalnızca site, bu üst bilgileri ayarlayan ve üzerine yazan bir ters proxy arkasında olduğunda etkinleştirin; aksi takdirde istemciler IP''lerini taklit edebilir ve oran sınırlamasını, IP yasaklarını ve denetim günlüğünü (audit log) atlatabilir.'
    HTTP_X_FORWARDED_PORT_ENABLED: HTTP_X_FORWARDED_PORT Etkin
    HTTP_X_FORWARDED_PORT_HELP: '<code>X-Forwarded-Port</code> istek üst bilgisine güvenin. Yalnızca site, bu üst bilgiyi ayarlayan ve üzerine yazan bir ters proxy arkasında olduğunda etkinleştirin.'
    HTTP_X_FORWARDED_PROTO_ENABLED: HTTP_X_FORWARDED_PROTO Etkin
    HTTP_X_FORWARDED_PROTO_HELP: '<code>X-Forwarded-Proto</code> istek üst bilgisine güvenin (genellikle TLS sonlandıran (TLS-terminating) bir proxy arkasındaki HTTPS''i tespit etmek için kullanılır). Yalnızca site, bu üst bilgiyi ayarlayan ve üzerine yazan bir ters proxy arkasında olduğunda etkinleştirin.'
    HTTP_CLIENT_IP_ENABLED: HTTP_CLIENT_IP Etkin
    HTTP_CLIENT_IP_HELP: 'İstemci IP''sini çözümlerken <code>Client-IP</code> istek üst bilgisine güvenin. Nadirdir; genellikle yalnızca belirli yük dengeleyiciler (load balancers) tarafından ayarlanır. Proxy''nizin bu üst bilgiyi ayarladığını ve üzerine yazdığını bilmiyorsanız kapalı bırakın.'
    HTTP_CF_CONNECTING_IP_ENABLED: HTTP_CF_CONNECTING_IP Etkin
    HTTP_CF_CONNECTING_IP_HELP: 'İstemci IP''sini çözümlerken <code>CF-Connecting-IP</code> istek üst bilgisine güvenin. Site gerçekten Cloudflare arkasında olduğunda etkinleştirin; aksi takdirde istemciler IP''lerini taklit edebilir. Tam güvenlik için, web sunucusundaki orijinal erişimi de Cloudflare IP aralıklarıyla sınırlandırın.'
