    TWIG_CONTENT_HELP: Sayfa içeriğine gömülü, editör tarafından yazılan Twig için kontrolleri içerir. Diskteki tema şablonları bu ayarlardan etkilenmez; ayarlar yalnızca yazarların sayfa gövdelerine veya ön bölüme (frontmatter) eklediği Twig'ler için geçerlidir.
    TWIG_CONTENT_PROCESS_ENABLED: İçerikte Twig'i Etkinleştir
    TWIG_CONTENT_PROCESS_ENABLED_HELP: "Ön bölümlerinde (frontmatter) <code>process: twig: true</code> olan sayfaların (ve site geneli <code>system.pages.frontmatter.process_twig</code> seçeneğinin) Twig'i gerçekten çalıştırmasına izin ver. <strong>Grav 2.0'da varsayılan olarak kapalıdır.</strong> Bunu devre dışı bırakmak, şablon enjeksiyonu saldırı yüzeyini azaltır, ancak gövdesinde Twig gerektiren tüm sayfaları bozar."
    TWIG_CONTENT_EDITOR_ENABLED: Editörlerin içerikte Twig'i açıp kapatmasına izin ver
    TWIG_CONTENT_EDITOR_ENABLED_HELP: "Kapalıyken (varsayılan), sayfa editörünün Gelişmiş (Advanced) sekmesindeki Twig onay kutusu yalnızca <code>admin.pages_twig</code> izni verilen kullanıcılara görünür ve halihazırda Twig'in etkin olduğu sayfalar yalnızca o kullanıcılar tarafından düzenlenebilir. Açıkken, sayfa düzenleme erişimi olan herhangi biri tekil sayfalar üzerinde Twig'i açıp kapatabilir."
    TWIG_CONTENT_CONFIG_ACCESS: Twig içinde yapılandırma değişkenlerine erişime izin ver
    TWIG_CONTENT_CONFIG_ACCESS_HELP: "<code>config</code> Twig değişkeninin sayfa içeriğinden okunabilir olup olmadığıdır. Kapalıyken (varsayılan), bir sayfadan <code>config.system.title</code> değerini okumak hiçbir şey döndürmez. Açıkken, <code>config</code> görünür durumdadır ancak kimlik bilgileri ve diğer hassas alt ağaçların gizli kalması için hala <code>config_denied_paths</code> (aşağıdaki Twig Korumalı Alanına bakın) ile filtrelenir."
