    TWIG_SANDBOX_ADMIN_HINT_HELP: 'Korumalı alan (sandbox) bir ifadeyi engellediğinde, oluşturulan sayfaya tek satırlık bir HTML yorumu ekler, böylece kaynağı görüntüleyen süper yöneticiler (super-admins) bir şeyin filtrelendiğini görür. Ziyaretçiler ve yönetici olmayanlar hiçbir şey görmez.'
    TWIG_SANDBOX_ENABLED_HELP: 'Editör tarafından yazılan sayfa içeriğini, izin listesi tabanlı (allowlist-based) bir Twig Güvenlik Politikası içinde oluşturur. <strong>Bunun devre dışı bırakılması, sayfa içeriği aracılığıyla gerçekleştirilebilecek şablon enjeksiyonu (template-injection) saldırılarına karşı tek korumayı kaldırır</strong>: Editör düzeyinde erişimi olan herhangi bir hesap (veya dosya sistemini ele geçiren herhangi biri), Twig aracılığıyla keyfi PHP yürütebilir. Yalnızca bir site, sayfa içeriğinden kapsayıcı erişimine gerçekten ihtiyaç duyuyorsa ve her yazara tamamen güveniyorsanız kapatın.'
